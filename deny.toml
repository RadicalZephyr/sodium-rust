# Configuration for cargo-deny. See https://embarkstudios.github.io/cargo-deny/
#
# Both the PR-time `cargo-deny` job and the scheduled `Security Audit` workflow
# read this file, so advisory ignores only need to be listed once.

[graph]
# Match the `--all-features` the CI jobs pass, so a local `cargo deny check`
# sees the same crate graph CI does.
all-features = true

[advisories]
# Nothing is ignored right now. The last entry was the unmaintained `atty`
# (RUSTSEC-2024-0375), which left the graph when env_logger went to 0.11.
ignore = []

[licenses]
# sodium-rust is BSD-3-Clause; everything we pull in must be compatible with
# redistributing it under that license.
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "MIT",
]

[bans]
# Duplicate versions are usually not our fault and not worth failing a build
# over, but we do want to see them.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
