name: Security Audit

on:
  push:
    branches:
      - main
    paths:
      - '**/Cargo.toml'
  schedule:
    - cron: '0 9 * * *' # run at 9 AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    name: Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # We deliberately do not commit a Cargo.lock, so this resolves fresh
      # every run -- which is the point of the nightly schedule: catch newly
      # published advisories against code that hasn't changed.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
