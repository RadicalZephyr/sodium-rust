[package]
name = "coz-driver"
version = "0.1.0"
edition = "2021"
# Matches the repository's root LICENSE, which already covers this directory.
# Stated explicitly so tooling that reads package metadata rather than the
# LICENSE file -- `cargo-deny check licenses` among them -- sees it too.
license = "BSD-3-Clause"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
sodium-rust = { path = ".." }

# `coz` calls sigaltstack/mmap unconditionally, so it does not build off
# POSIX, and its counter lookup is itself gated to Linux -- on any other
# platform the profiler records nothing. Keeping the dependency Linux-only
# lets `cargo test --workspace` succeed everywhere.
[target.'cfg(target_os = "linux")'.dependencies]
coz = "0.1"
