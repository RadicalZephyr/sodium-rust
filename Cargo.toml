[workspace]
members = ["coz-driver"]

[package]
name = "sodium-rust"
version = "2.1.3"
authors = ["Clinton Selke <clinuxrulz@gmail.com>", "Zefira Shannon <zefira@hey.com>"]
edition = "2021"
rust-version = "1.71"
license = "BSD-3-Clause"
repository = "https://github.com/SodiumFRP/sodium-rust"
categories = ["asynchronous", "rust-patterns"]
keywords = ["frp", "functional", "reactive", "observer", "events"]
description = "Sodium FRP (Functional Reactive Programming)"

[dependencies]
log = "0.4.8"
parking_lot = "0.12.1"

[dev-dependencies]
criterion = "0.4"
env_logger = "0.9.0"
# `rustversion` gates the trybuild `compile_fail` cases to stable: their
# expected stderr is rustc-version sensitive, and CI also runs beta and nightly.
rustversion = "1.0"
trybuild = "1.0"

[profile.release]
debug = 1

[[bench]]
name = "sodium"
harness = false
